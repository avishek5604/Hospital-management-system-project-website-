<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediCore Hospital Management System">
  <title>MediCore HMS - Login</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

  <div class="login-container">

    <div class="login-card">

      <div class="login-logo">
        <div class="logo-icon">✚</div>
        <div>
          <h1>Medi<span>Core</span></h1>
          <p>Hospital Management System</p>
        </div>
      </div>

      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access your hospital dashboard</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span>✉</span>
            <input
              type="email"
              id="email"
              placeholder="admin@medicore.com"
              value="admin@medicore.com"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span>🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              value="admin123"
              required
            >
            <button type="button" id="togglePassword">👁</button>
          </div>
        </div>

        <div class="login-options">
          <label>
            <input type="checkbox" checked>
            Remember me
          </label>

          <a href="#" onclick="forgotPassword(event)">
            Forgot Password?
          </a>
        </div>

        <button type="submit" class="login-button">
          <span>Sign In</span>
          →
        </button>

      </form>

      <div class="demo-login">
        <strong>Demo Credentials</strong>
        <p>Email: admin@medicore.com</p>
        <p>Password: admin123</p>
      </div>

      <div class="login-footer">
        © 2026 MediCore HMS. All Rights Reserved.
      </div>

    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      if (password.type === "password") {
        password.type = "text";
        togglePassword.textContent = "🙈";
      } else {
        password.type = "password";
        togglePassword.textContent = "👁";
      }
    });

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;

      if (
        email === "admin@medicore.com" &&
        pass === "admin123"
      ) {
        localStorage.setItem("hmsLoggedIn", "true");
        localStorage.setItem("hmsUser", "Administrator");

        window.location.href = "dashboard.html";
      } else {
        alert("Invalid email or password.");
      }
    });

    function forgotPassword(event) {
      event.preventDefault();
      alert(
        "For this demo system, please use:\n\n" +
        "Email: admin@medicore.com\n" +
        "Password: admin123"
      );
    }
  </script>

</body>
</html>
